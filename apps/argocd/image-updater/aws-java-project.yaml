apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: aws-java-project
  namespace: argocd
spec:
  writeBackConfig:
    method: "argocd"
  applicationRefs:
    # Matches every environment's generated Application (aws-java-project-dev,
    # -staging, -prod, ...) without listing them here. Each Application's own
    # image/tag/strategy comes from the annotations the ApplicationSet
    # template sets per env (see apps/argocd/applicationsets/apps.yml) --
    # this file never needs to change when an environment is added.
    - namePattern: "aws-java-project-*"
      labelSelectors:
        matchLabels:
          image-updater: aws-java-project
      useAnnotations: true
