apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aws-java-project
  namespace: argocd
spec:
  # Without this, the ApplicationSet controller re-templates the Application
  # on every reconcile (it runs continuously) and wipes out the Helm
  # parameter override that Argo CD Image Updater sets on the live
  # Application to pin the resolved image digest -- the two fight, and the
  # override never survives long enough to be synced. This tells the
  # ApplicationSet controller to leave that one field alone once it's set
  # out-of-band; nothing in git changes because of this.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/source/helm/parameters
  generators:
    - list:
        elements:
          # Add a new environment by adding one entry here --
          # it must have a matching apps/aws-java-project/envs/<env>/values.yaml file.
          - env: dev
          - env: stage
  template:
    metadata:
      name: 'aws-java-project-{{env}}'
      labels:
        image-updater: aws-java-project
      annotations:
        # Argo CD Image Updater config, templated per environment -- adding a
        # new `env` entry above is the only change needed; nothing in the
        # ImageUpdater CR (apps/argocd/image-updater/aws-java-project.yaml)
        # ever needs to change.
        argocd-image-updater.argoproj.io/image-list: '924279027628.dkr.ecr.ap-south-1.amazonaws.com/aws-java-project:{{env}}'
        argocd-image-updater.argoproj.io/aws-java-project.update-strategy: digest
        argocd-image-updater.argoproj.io/aws-java-project.helm.image-name: image.repository
        argocd-image-updater.argoproj.io/aws-java-project.helm.image-tag: image.tag
    spec:
      project: default
      source:
        repoURL: https://github.com/Kritik72/k8s-helm-config.git
        targetRevision: master
        path: apps/aws-java-project/chart
        helm:
          valueFiles:
            - ../envs/{{env}}/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{env}}'
      syncPolicy:
          syncOptions:
          - CreateNamespace=true
