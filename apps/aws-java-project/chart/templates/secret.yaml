{{- if .Values.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aws-java-project.fullname" . }}-secret
  labels:
    {{- include "aws-java-project.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secret }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
{{- end }}
