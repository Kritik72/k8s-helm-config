# dev overrides -- only keys that differ from chart/values.yaml go here.

replicaCount: 1

image:
  # Local-only override: the ECR repo doesn't exist yet, so this points at
  # the image built+loaded into kind via `kind load docker-image` instead.
  # Revert to the ECR repository below once a real image is pushed there.
  repository: aws-java-project
  tag: "local"
  pullPolicy: Never
  # repository: 924279027628.dkr.ecr.ap-south-1.amazonaws.com/aws-java-project
  # tag: "dev"

config:
  SPRING_PROFILES_ACTIVE: dev
  LOG_LEVEL: debug
  AWS_REGION: ap-south-1
  AWS_SQS_QUEUE_URL: https://sqs.ap-south-1.amazonaws.com/924279027628/dev-sample-sqs
  AWS_SNS_TOPIC_ARN: arn:aws:sns:ap-south-1:924279027628:dev-sample-sns
  AWS_DYNAMODB_TABLE_NAME: dev-sample-table

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: aws-java-project-dev.example.com
      paths:
        - path: /
          pathType: Prefix

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: "/actuator/prometheus"
