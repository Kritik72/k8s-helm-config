kube-prometheus-stack:
  grafana:
    adminPassword: ""   # set per-env in envs/<env>/values.yaml — never commit a real one here
    defaultDashboardsEnabled: true

  prometheus:
    prometheusSpec:
      retention: 7d
      serviceMonitorSelectorNilUsesHelmValues: true   # only ServiceMonitors labeled release: <this-helm-release> get scraped
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi

  alertmanager:
    enabled: true