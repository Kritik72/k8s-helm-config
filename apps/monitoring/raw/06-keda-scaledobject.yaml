apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: aws-java-project-rps
  namespace: dev
spec:
  scaleTargetRef:
    name: aws-java-project-dev
  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring-raw.svc.cluster.local:9090
        query: sum(rate(http_server_requests_seconds_count{application="aws-java-project"}[2m]))
        threshold: "10"
